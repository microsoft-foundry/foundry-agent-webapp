<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Chat</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7280; --border: #e3e6eb;
    --user: #2557d6; --user-text: #ffffff; --accent: #2557d6; --warn: #b45309; --warn-bg: #fff7ed;
    --error: #b91c1c; --error-bg: #fef2f2; --inner-bg: #f3f4f6; --meter: #16a34a; --meter-hi: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e6e8ec; --muted: #9aa3b2; --border: #2c323d;
      --user: #3b6ef0; --inner-bg: #232833; --warn: #fbbf24; --warn-bg: #2a2214;
      --error: #f87171; --error-bg: #2a1616;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  .app { display: flex; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header .sub { color: var(--muted); font-size: 13px; font-weight: normal; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  label.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .meter { font-size: 12px; color: var(--muted); min-width: 190px; }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .bar > div { height: 100%; width: 0; background: var(--meter); transition: width .4s; }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); }
  .assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .status { color: var(--muted); font-size: 13px; font-style: italic; }
  .wait { color: var(--warn); background: var(--warn-bg); font-size: 13px; padding: 6px 10px; border-radius: 8px; margin-top: 6px; }
  .error { color: var(--error); background: var(--error-bg); font-size: 13px; padding: 6px 10px; border-radius: 8px; margin-top: 6px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  details.inner { margin-top: 8px; font-size: 13px; }
  details.inner summary { color: var(--muted); cursor: pointer; }
  details.inner pre { background: var(--inner-bg); padding: 8px; border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0; font-size: 12px; }
  body:not(.show-inner) details.inner { display: none; }
  .empty { color: var(--muted); text-align: center; margin-top: 20vh; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  textarea { flex: 1; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); resize: none; min-height: 44px; max-height: 160px; }
  @media (max-width: 600px) { .msg { max-width: 95%; } .meter { min-width: 0; width: 100%; } }
</style>
</head>
<body class="show-inner">
<div class="app">
  <header>
    <h1>Agent Chat <span class="sub" id="agentName"></span></h1>
    <div class="meter" id="meter">
      <span id="meterText">Token budget</span>
      <div class="bar"><div id="meterBar"></div></div>
    </div>
    <label class="toggle"><input type="checkbox" id="showInner" checked> Inner agent steps</label>
    <button id="newChat">New chat</button>
  </header>
  <main id="messages"><div class="empty" id="empty">Ask a question to start a conversation.</div></main>
  <form id="form">
    <textarea id="input" placeholder="Type a message… (Enter to send, Shift+Enter for a new line)" rows="1"></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </form>
</div>
<script>
  const $ = id => document.getElementById(id);
  let conversationId = null;
  let busy = false;

  $('showInner').onchange = e => document.body.classList.toggle('show-inner', e.target.checked);
  $('newChat').onclick = () => {
    if (busy) return;
    conversationId = null;
    $('messages').innerHTML = '<div class="empty" id="empty">Ask a question to start a conversation.</div>';
  };
  $('input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); }
  });

  function add(cls, text = '') {
    $('empty')?.remove();
    const el = document.createElement('div');
    el.className = `msg ${cls}`;
    el.textContent = text;
    $('messages').appendChild(el);
    el.scrollIntoView({ block: 'end' });
    return el;
  }
  function note(parent, cls, text) {
    const el = document.createElement('div');
    el.className = cls;
    el.textContent = text;
    parent.appendChild(el);
    return el;
  }

  $('form').onsubmit = async e => {
    e.preventDefault();
    const message = $('input').value.trim();
    if (!message || busy) return;
    busy = true; $('send').disabled = true; $('newChat').disabled = true;
    $('input').value = '';
    add('user', message);

    const bubble = add('assistant');
    const answer = document.createElement('div');
    const status = note(bubble, 'status', 'Sending…');
    bubble.prepend(answer);
    const inner = document.createElement('details');
    inner.className = 'inner';
    inner.innerHTML = '<summary>Inner agent steps</summary>';
    let waitEl = null;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversationId, message }),
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n\n')) >= 0) {
          const line = buffer.slice(0, idx); buffer = buffer.slice(idx + 2);
          if (!line.startsWith('data:')) continue;
          const ev = JSON.parse(line.slice(5));
          switch (ev.type) {
            case 'conversation': conversationId = ev.conversationId; break;
            case 'status': status.textContent = ev.text; break;
            case 'wait':
              waitEl ??= note(bubble, 'wait', '');
              waitEl.textContent = `Waiting ~${ev.seconds}s to stay within the ${ev.reason} limit…`;
              break;
            case 'delta':
              waitEl?.remove(); waitEl = null;
              answer.textContent += ev.text; break;
            case 'inner': {
              if (!inner.isConnected) bubble.appendChild(inner);
              const h = document.createElement('div');
              h.textContent = ev.agent;
              const pre = document.createElement('pre');
              let text = ev.text;
              try { text = JSON.stringify(JSON.parse(text), null, 2); } catch {}
              pre.textContent = text;
              inner.append(h, pre);
              break;
            }
            case 'error': note(bubble, 'error', ev.message); break;
            case 'done': {
              waitEl?.remove();
              const u = ev.usage;
              status.remove();
              note(bubble, 'meta', `${(ev.durationMs / 1000).toFixed(1)}s${u ? ` · ${u.total_tokens.toLocaleString()} tokens` : ''}`);
              break;
            }
          }
          bubble.scrollIntoView({ block: 'end' });
        }
      }
      if (!answer.textContent && !bubble.querySelector('.error')) note(bubble, 'error', 'No answer was returned.');
    } catch (err) {
      note(bubble, 'error', `Request failed: ${err.message}`);
    } finally {
      status.isConnected && status.remove();
      busy = false; $('send').disabled = false; $('newChat').disabled = false;
      $('input').focus();
    }
  };

  async function refreshStatus() {
    try {
      const s = await (await fetch('/api/status')).json();
      $('agentName').textContent = `· ${s.agent} (v${s.agentVersion})`;
      const pct = Math.min(100, Math.round(100 * s.tokensUsedLastMinute / s.tpmBudget));
      $('meterText').textContent = `Last 60s: ${s.tokensUsedLastMinute.toLocaleString()} / ${s.tpmBudget.toLocaleString()} tokens · ${s.runsLastMinute}/${s.runsPerMinute} runs`;
      $('meterBar').style.width = pct + '%';
      $('meterBar').style.background = pct > 80 ? 'var(--meter-hi)' : 'var(--meter)';
    } catch {}
  }
  refreshStatus();
  setInterval(refreshStatus, 3000);
</script>
</body>
</html>
